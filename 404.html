<!doctype html>
<html lang="fr">
<head>

<title>Page introuvable · Nour Planner</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0b;color:#f3e7c4;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:460px}
  .n{font:600 72px/1 Georgia,"Times New Roman",serif;color:#d8b25a;margin:0 0 6px}
  h1{font:500 24px/1.3 Georgia,"Times New Roman",serif;margin:0 0 12px}
  p{margin:0 0 22px;color:#c9c3b6}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px}
  .gold{background:#d8b25a;color:#0a0a0b}
  .ghost{border:1px solid rgba(216,178,90,.45);color:#f3e7c4}
</style>
</head>
<body>
<main>
  <p class="n">404</p>
  <h1>Cette page est introuvable</h1>
  <p>L'adresse n'existe pas ou le fichier n'a pas été envoyé sur le site. Reviens à l'accueil ou ouvre directement l'app.</p>
  <div class="row">
    <a class="gold" href="/">Page d'accueil</a>
    <a class="ghost" href="/app.html">Ouvrir l'app</a>
  </div>
</main>
